# docker-compose.yml para pruebas locales con Coolify
# Uso: docker-compose up

version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mha-daily-guess
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - PORT=80
      - HOST=0.0.0.0
      # Añade aquí tus variables VITE_* si es necesario
      # - VITE_API_URL=https://tu-api.com
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:80', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
